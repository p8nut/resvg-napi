[package]
name = "toy-napi"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0 OR MIT"
description = "The toy crate's napi binding, generated by napi-gen: CI's proof the generator is generic"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { workspace = true, features = ["napi8", "napi9"] }
napi-derive = { workspace = true }
napi-support = { path = "../napi-support" }
# `extra` on, `gpu` on wasm alone: `GEN.features` says the same. `toy-dep`
# is reached through `toy`'s re-export (`GEN.uses`), not as a dependency of
# its own.
toy = { path = "../toy", features = ["extra"] }

[target.'cfg(target_family = "wasm")'.dependencies]
toy = { path = "../toy", features = ["extra", "gpu"] }

[build-dependencies]
napi-build = { workspace = true }
napi-gen = { path = "../napi-gen" }
syn = { version = "3.0", features = ["full", "extra-traits", "parsing", "printing"] }
quote = "1.0.35"
