# Only what nothing else watches. The actions are pinned to major tags and would
# otherwise sit on v7 forever, and the dev dependencies rot quietly. Cargo is
# left out on purpose: .github/workflows/resvg.yml asks upstream every Monday
# whether the resvg version moved, and the `pins` job in CI.yml fails when the
# emnapi and napi-build pins in Cargo.toml stop being necessary. Dependabot has
# no way to know that and would only propose breaking them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: development
      # Runtime dependencies, and the three the builder insists agree.
      - dependency-name: '@emnapi/core'
      - dependency-name: '@emnapi/runtime'
      - dependency-name: '@napi-rs/wasm-runtime'
    groups:
      # These move together or not at all: the builder aborts with `emnapi
      # version mismatch` when emnapi, @emnapi/core and @emnapi/runtime
      # disagree. For a while they could not move at all -- @napi-rs/cli
      # depended on wasm sub-packages that pinned @emnapi/core exactly, and
      # nothing here could lift a transitive pin, so both were ignored and the
      # CLI was the gate. cli 3.9.1 and wasm-runtime 1.2.4 moved them to
      # peerDependencies: the root provides them now, all three are visible to
      # dependabot, and one grouped pull request can carry the set.
      napi:
        patterns: ['emnapi', '@emnapi/*', '@napi-rs/cli', '@napi-rs/wasm-runtime']
      # Minor and patch only. A major in a group means one breaking bump blocks
      # every safe one in the same pull request -- majors come on their own,
      # where a red build points at the dependency that caused it.
      dev-dependencies:
        patterns: ['*']
        exclude-patterns: ['emnapi', '@emnapi/*', '@napi-rs/cli', '@napi-rs/wasm-runtime']
        update-types: [minor, patch]
