name: pages

# The demo is the fastest answer to "what does this do": a page that renders SVG
# through these bindings compiled to WASI, with no install. Deployed from main on
# every push -- no paths filter, because a filter that misses a path leaves a
# stale demo online and says nothing, and the cargo cache makes the rebuild cheap.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel: a superseded deploy has already replaced the site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The toolchain rust-toolchain.toml pins, as in CI.yml.
      - run: rustup toolchain install && rustup target add wasm32-wasip1-threads
      # Pinned and saved from main only, as in CI.yml's build job: this job
      # holds pages and id-token write, and a dispatch from another branch would
      # only write a cache nothing else can read.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm32-wasip1-threads
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm install  # not `npm ci` -- see the build job in CI.yml
      # The wasm, the three bundles, and the example list the picker reads.
      - run: npm run demo:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo
      - uses: actions/deploy-pages@v5
        id: deploy
