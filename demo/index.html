<!doctype html>
<meta charset="utf-8">
<title>resvg-napi — WASI demo</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in oklab, currentColor 15%, transparent); }
  body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
         display: grid; grid-template-columns: minmax(320px, 30rem) 1fr; height: 100vh; }
  section { padding: 1.25rem; overflow: auto; }
  section + section { border-left: 1px solid var(--line); }
  h1 { font-size: 1rem; margin: 0 0 1rem; font-weight: 650; }
  h1 small { font-weight: 400; opacity: .6; }
  #wanted { border: 1px solid #b4530955; background: #b4530911;
            border-radius: 6px; padding: .6rem .9rem; margin: .75rem 0; }
  #wanted p { margin: 0 0 .4rem; font-weight: 600; }
  #wanted ul { margin: 0; padding-left: 1.1rem; }
  #wanted li { font: 12px/1.6 ui-monospace, monospace; }
  #wanted li.ok { opacity: .55; text-decoration: line-through; }
  #wanted > div + div { margin-top: .9rem; padding-top: .7rem;
                       border-top: 1px solid #b4530933; }
  #imagesList li { display: flex; align-items: center; gap: .5rem; margin: .25rem 0; }
  #imagesList code { background: #8881; padding: .1rem .3rem; border-radius: 4px; }
  #imagesList input[type=file] { font-size: 11px; }
  #drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 1rem;
          text-align: center; display: grid; gap: .2rem; margin: .75rem 0; }
  #drop span { font-size: 12px; opacity: .65; }
  #drop.over { border-color: #0ea5e9; background: #0ea5e911; }
  #vars { border: 1px solid var(--line); border-radius: 8px; padding: .7rem .9rem;
          margin: .75rem 0; }
  #vars p { margin: 0 0 .5rem; }
  #vars #varsCount, #vars #varsNote { font-size: 12px; opacity: .6; font-weight: 400; }
  #vars #varsNote { margin: .5rem 0 0; }
  #varsList { display: grid; grid-template-columns: auto 1fr; gap: .35rem .6rem;
              align-items: center; }
  #varsList code { font: 12px ui-monospace, monospace; text-align: right; }
  #varsList .chain { opacity: .55; }
  #varsList .chain.stub { color: #b45309; opacity: .85; }
  #varsList .imgvar { display: flex; align-items: center; gap: .5rem; }
  #varsList .imgvar span { font-size: 11px; opacity: .6; }
  #varsList .imgvar input[type=file] { font-size: 11px; }
  #varsList input { padding: .3rem .45rem; border-radius: 5px; border: 1px solid var(--line);
                    background: transparent; color: inherit; font: inherit; width: 100%; }
  textarea { width: 100%; height: 14rem; font: 12px/1.5 ui-monospace, monospace;
             padding: .6rem; border: 1px solid var(--line); border-radius: 6px;
             background: transparent; color: inherit; resize: vertical; }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: end; margin: .75rem 0; }
  label { display: grid; gap: .25rem; font-size: 12px; opacity: .8; }
  label.inline { display: flex; align-items: center; gap: .4rem; }
  textarea { overflow: auto; }
  input[type=number], input[type=text] { width: 7rem; padding: .35rem .5rem; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; }
  button { padding: .45rem .9rem; border-radius: 6px; border: 1px solid var(--line);
           background: color-mix(in oklab, currentColor 8%, transparent); color: inherit;
           font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #out { max-width: 100%; border: 1px solid var(--line); border-radius: 6px;
         background: repeating-conic-gradient(#8884 0 25%, transparent 0 50%) 0 0/16px 16px; }
  pre { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap;
        background: color-mix(in oklab, currentColor 6%, transparent);
        padding: .6rem .75rem; border-radius: 6px; }
  .warn { color: #b45309; }
</style>

<section>
  <h1>resvg-napi <small>— same generated bindings, running as WASI wasm</small></h1>

  <textarea id="svg" spellcheck="false" autocomplete="off"></textarea>

  <div class="row">
    <label>scale <input id="scale" type="number" value="2" min="0.1" step="0.5"></label>
    <label>width (px) <input id="width" type="number" placeholder="auto" min="1"></label>
    <label>background <input id="bg" type="text" value="" placeholder="transparent"></label>
    <label class="inline"><input id="crop" type="checkbox"> crop to content</label>
  </div>

  <div class="row">
    <button id="render" disabled>Render</button>
  </div>

  <div id="vars" hidden>
    <p><b>Template variables</b> <span id="varsCount"></span></p>
    <div id="varsList"></div>
    <p id="varsNote"></p>
  </div>

  <div id="drop">
    <b>Drop fonts and images here</b>
    <span>or paste them (⌘/Ctrl-V) — or use the file fields below</span>
  </div>

  <div id="wanted" hidden>
    <div id="fontsWanted" hidden>
      <p id="fontsMsg" class="warn"></p>
      <ul id="fontsList"></ul>
      <label>upload font file(s)
        <input id="font" type="file" accept=".ttf,.otf,.ttc" multiple></label>
    </div>
    <div id="imagesWanted" hidden>
      <p class="warn">This SVG references images that could not be resolved.
        Upload one file per reference:</p>
      <ul id="imagesList"></ul>
    </div>
  </div>

  <pre id="log">loading wasm…</pre>
</section>

<section>
  <img id="out" alt="rendered output">
  <pre id="info"></pre>
</section>

<script type="module">
  // napi's `Buffer` return type is Node's Buffer, and emnapi looks it up on
  // globalThis -- browsers have no such thing. Node's Buffer is a Uint8Array
  // subclass, and emnapi only touches `from`, `alloc` and `isBuffer`, so this
  // is enough. Installed before the wasm module is imported.
  class BufferPolyfill extends Uint8Array {
    static from(src, offset, length) {
      // With wasm threads the module's memory is a SharedArrayBuffer, not an
      // ArrayBuffer -- missing that case yields empty views.
      const isBuf = src instanceof ArrayBuffer
        || (typeof SharedArrayBuffer !== 'undefined' && src instanceof SharedArrayBuffer);
      return isBuf
        ? new BufferPolyfill(src, offset, length)
        : new BufferPolyfill(Uint8Array.from(src));
    }
    static alloc(size) { return new BufferPolyfill(size); }
    static isBuffer(value) { return value instanceof BufferPolyfill; }
  }
  globalThis.Buffer ??= BufferPolyfill;

  const { Liquid, qrSvg } = await import('./liquid.js');
  // Lenient on purpose: an unknown filter passes its value through instead of
  // throwing, so a template can be inspected before every filter exists.
  const liquid = new Liquid({ strictFilters: false, strictVariables: false });
  // `{{ upn | qr: '#ffffff', '#00000000' }}` -> a QR code as a nested <svg>
  // that scales to the viewport it lands in. Arguments: module colour,
  // background colour (`#00000000` for transparent), error-correction level.
  const STUBBED = new Set();
  liquid.registerFilter('qr', (value, dark, light, level) => qrSvg(value, dark, light, level));

  const $ = (id) => document.getElementById(id);
  const log = (msg) => { $('log').textContent = msg; };

  const debounce = (fn, ms) => {
    let timer;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), ms);
    };
  };

  // Deferred variants, declared up here because the wiring below runs during
  // module evaluation. 200 ms is short enough to feel live, long enough that a
  // burst of keystrokes parses once instead of once per character. `analyse` and
  // `render` are function declarations, so referring to them now is fine.
  const analyseSoon = debounce(() => analyse(), 200);
  const renderSoon = debounce(() => render(), 350);

  // Images the user supplied, keyed by the href the document uses. Declared up
  // here because `analyse()` runs during init, above its own definition.
  const images = new Map();

  // Values typed for the template's variables, by name.
  const vars = new Map();

  // The SVG actually handed to resvg: the source rendered through Liquid when it
  // has variables. A variable left empty renders back to its own `{{ name }}`,
  // so an image href placeholder stays visible to `pendingImages()` and can be
  // resolved by an upload.
  function source() {
    // usvg rejects an XML declaration that is not at offset 0, and Illustrator
    // exports routinely arrive with a leading newline.
    const raw = $('svg').value.replace(/^\s+(?=<\?xml)/, '');
    let names = [];
    try {
      names = liquid.globalVariablesSync(liquid.parse(raw));
    } catch {
      return raw; // not a valid template: hand the source over untouched
    }
    if (!names.length) return raw;
    const scope = {};
    for (const name of names) {
      // A variable is a value, never a document: an XML declaration pasted into
      // a field would land mid-file and make the whole SVG invalid.
      const value = (vars.get(name) || '').replace(/<\?xml[^>]*\?>/g, '').trim();
      scope[name] = value || `{{ ${name} }}`;
    }
    try {
      return liquid.parseAndRenderSync(raw, scope);
    } catch (e) {
      log(`liquid: ${e.message}`);
      return raw;
    }
  }

  // `{{ upn | qr: '#fff', '#000' }}` is a variable *and* a filter chain. The
  // static analysis API reports variables only, so the chains come off the
  // parsed template instead: an Output node carries `value.initial` (the
  // variable) and `value.filters` (name + args), which beats string-splitting
  // the source -- it handles `{{-`, quoting, newlines and nested arguments.
  function filterChains(raw) {
    const chains = new Map();
    let templates;
    try {
      templates = liquid.parse(raw);
    } catch {
      return chains;
    }
    const visit = (nodes, depth = 0) => {
      if (!Array.isArray(nodes) || depth > 6) return;
      for (const node of nodes) {
        const filters = node?.value?.filters ?? [];
        if (filters.length) {
          const path = node.value.initial?.postfix?.[0]?.getText?.() ?? '';
          const root = path.split(/[.[]/)[0];
          if (root) {
            chains.set(root, filters.map((f) => {
              const args = (f.args ?? []).map((a) => a.getText?.() ?? String(a));
              return args.length ? `${f.name}: ${args.join(', ')}` : f.name;
            }));
          }
        }
        // blocks: {% if %}, {% for %}, {% case %}...
        visit(node?.templates, depth + 1);
        visit(node?.elseTemplates, depth + 1);
        for (const branch of node?.branches ?? []) visit(branch?.templates, depth + 1);
      }
    };
    visit(templates);
    return chains;
  }

  // A variable used as an `<image>` href wants a file, not a string. This one is
  // an XML question, not a Liquid one, so parse the document; while the source is
  // being typed it will not be well-formed, hence the fallback scan.
  function imageHrefVars(raw) {
    const found = new Set();
    const add = (href) => {
      for (const [, expr] of (href ?? '').matchAll(/\{\{-?([\s\S]*?)-?\}\}/g)) {
        found.add(expr.split('|')[0].trim().split(/[.[\s]/)[0]);
      }
    };
    const doc = new DOMParser().parseFromString(raw, 'image/svg+xml');
    if (!doc.querySelector('parsererror')) {
      for (const img of doc.getElementsByTagName('image')) {
        add(img.getAttributeNS('http://www.w3.org/1999/xlink', 'href') ?? img.getAttribute('href'));
      }
      return found;
    }
    for (const [, attrs] of raw.matchAll(/<image\b([^>]*)>/gi)) {
      add(attrs.match(/(?:xlink:)?href\s*=\s*"([^"]*)"/i)?.[1]);
    }
    return found;
  }

  // Files chosen for those variables, by variable name.
  const imageVars = new Map();

  // Signature of the *shape* of the form. Rebuilding the fields on every
  // keystroke would blow away the focused input mid-word, so the DOM is only
  // touched when the variables, their filter chains or their kind change.
  let varsSignature = null;

  function showVariables() {
    let names = [];
    try {
      names = liquid.globalVariablesSync(liquid.parse($('svg').value));
    } catch { /* incomplete template while typing */ }
    const chains = filterChains($('svg').value);
    $('vars').hidden = names.length === 0;
    if (!names.length) {
      varsSignature = null;
      return;
    }
    const asImage = imageHrefVars($('svg').value);
    const signature = names
      .map((n) => `${n}:${(chains.get(n) ?? []).join('|')}:${asImage.has(n) ? 'img' : 'txt'}`)
      .join(',');
    if (signature === varsSignature) return;
    varsSignature = signature;
    $('varsCount').textContent = `— ${names.length} found by liquidjs`;
    const stubbed = [...chains.values()]
      .map((c) => c[0].split(':')[0].trim())
      .filter((f) => STUBBED.has(f));
    $('varsNote').textContent = 'Empty fields keep their `{{ name }}` placeholder, so an '
      + 'image variable stays uploadable. Unknown filters pass their value through; '
      + '`qr` generates a QR code as SVG.'
      + (stubbed.length ? ` Stubbed: ${[...new Set(stubbed)].join(', ')}.` : '');
    $('varsList').replaceChildren(...names.flatMap((name) => {
      const code = document.createElement('code');
      const chain = chains.get(name);
      code.textContent = name;
      if (chain) {
        const pipe = document.createElement('span');
        pipe.className = 'chain';
        pipe.textContent = ` | ${chain.join(' | ')}`;
        pipe.title = STUBBED.has(chain[0].split(':')[0].trim())
          ? 'filter registered as a stub: returns an empty string'
          : 'filter applied by liquidjs';
        if (STUBBED.has(chain[0].split(':')[0].trim())) pipe.classList.add('stub');
        code.append(pipe);
      }
      if (asImage.has(name)) {
        // Substituting a stable synthetic href and registering the bytes under
        // it keeps resolution independent of what the placeholder renders to.
        const href = `var:${name}`;
        const wrap = document.createElement('div');
        wrap.className = 'imgvar';
        const file = document.createElement('input');
        file.type = 'file';
        file.accept = 'image/png,image/jpeg,image/gif,image/webp,image/svg+xml,.svg';
        const name_ = document.createElement('span');
        name_.textContent = imageVars.get(name)?.name ?? 'used as an <image> href';
        file.addEventListener('change', async (ev) => {
          const picked = ev.target.files[0];
          if (!picked) return;
          const bytes = new Uint8Array(await picked.arrayBuffer());
          imageVars.set(name, { name: picked.name, bytes });
          images.set(href, bytes);
          vars.set(name, href);
          name_.textContent = `${picked.name} (${picked.size.toLocaleString()} bytes)`;
          analyse();
          render();
        });
        wrap.append(file, name_);
        return [code, wrap];
      }

      const input = document.createElement('input');
      input.value = vars.get(name) ?? '';
      input.placeholder = `{{ ${name} }}`;
      // The value is recorded immediately; re-parsing and re-rendering wait
      // until typing stops.
      input.addEventListener('input', () => {
        vars.set(name, input.value);
        analyseSoon();
        renderSoon();
      });
      input.addEventListener('change', () => {
        analyse();
        render();
      });
      return [code, input];
    }));
  }

  $('svg').value = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="12" y="12" width="216" height="96" rx="14" fill="url(#g)"/>
  <circle cx="196" cy="34" r="16" fill="#fff" opacity=".35" filter="url(#blur)"/>
  <text x="28" y="72" font-family="sans-serif" font-size="30" fill="#fff">resvg</text>
</svg>`;

  let mod, fonts;
  try {
    if (!globalThis.crossOriginIsolated) {
      log('⚠ not cross-origin isolated: SharedArrayBuffer is unavailable, so the threaded '
        + 'wasm cannot start. Serve this page with serve.mjs (COOP + COEP).');
      throw new Error('not isolated');
    }
    mod = await import('./resvg.js');
    fonts = new mod.FontDatabase();
    $('render').disabled = false;
    // Handy for poking at the API from the devtools console.
    globalThis.resvg = { mod, fonts };
    log(`wasm ready — ${Object.keys(mod).length} exports. `
      + `loadSystemFonts() finds ${fonts.len()} faces in the sandbox, so text needs a font file.`);
  } catch (e) {
    if (e.message !== 'not isolated') log(`failed to load wasm: ${e.message}`);
  }

  // After the module body has run, so every helper below is initialised.
  if (mod) analyse();

  // Function declaration, not a const arrow: `analyse()` runs from the init
  // block above, before this point in the module body.
  function parse() {
    return new mod.Resvg(source(), defaults(), fonts, Object.fromEntries(images));
  }

  // Parse once with the current state to find out what the document is missing:
  // `pendingFonts()` lists named families the database does not have,
  // `pendingImages()` the hrefs neither the uploads nor the filesystem resolved,
  // and a look at the source tells us whether there is any text at all
  // (a generic `font-family` never shows up as a named family).
  function analyse() {
    showVariables();
    let doc;
    try {
      doc = parse();
    } catch {
      $('wanted').hidden = true;
      return;
    }

    const missingFonts = doc.pendingFonts();
    const hasText = /<text[\s>]/.test(source());
    const needAnyFont = hasText && fonts.len() === 0;
    const missingImages = doc.pendingImages();

    // fonts
    const wantFonts = missingFonts.length > 0 || needAnyFont;
    $('fontsWanted').hidden = !wantFonts;
    if (wantFonts) {
      $('fontsMsg').textContent = missingFonts.length
        ? `This SVG asks for ${missingFonts.length} font famil`
          + `${missingFonts.length > 1 ? 'ies' : 'y'} the database does not have:`
        : 'This SVG has text but no font is loaded — WASI has no system fonts.';
      $('fontsList').replaceChildren(...(missingFonts.length
        ? missingFonts
        : ['(any font, for the generic families)']).map((name) => {
          const li = document.createElement('li');
          li.textContent = name;
          return li;
        }));
    }

    // images: one input per href, because the file/href pairing is explicit
    $('imagesWanted').hidden = missingImages.length === 0;
    $('imagesList').replaceChildren(...missingImages.map((href) => {
      const li = document.createElement('li');
      const code = document.createElement('code');
      code.textContent = href;
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/png,image/jpeg,image/gif,image/webp,image/svg+xml,.svg';
      input.addEventListener('change', async (ev) => {
        const file = ev.target.files[0];
        if (!file) return;
        images.set(href, new Uint8Array(await file.arrayBuffer()));
        log(`resolved ${href} with ${file.name} (${file.size.toLocaleString()} bytes)`);
        analyse();
        render();
      });
      // Dropping straight onto a row pins the file to that href.
      for (const type of ['dragenter', 'dragover']) {
        li.addEventListener(type, (e) => { e.preventDefault(); li.style.opacity = '.6'; });
      }
      li.addEventListener('dragleave', () => { li.style.opacity = ''; });
      li.addEventListener('drop', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        li.style.opacity = '';
        const file = e.dataTransfer.files[0];
        if (!file) return;
        images.set(href, new Uint8Array(await file.arrayBuffer()));
        log(`resolved ${href} with ${file.name}`);
        analyse();
        render();
      });
      li.append(code, input);
      return li;
    }));

    $('wanted').hidden = $('fontsWanted').hidden && $('imagesWanted').hidden;
  }

  function defaults() {
    const first = fonts.len() ? fonts.faces()[0].families[0] : undefined;
    return first ? { fontFamily: first } : undefined;
  }

  // Anything dropped or pasted lands here. A font goes into the database; an
  // image is matched to a pending href -- by file name when it matches, else to
  // the first one still waiting.
  async function accept(fileList) {
    const files = [...fileList];
    if (!files.length) return;
    const isFont = (f) => /\.(ttf|otf|ttc)$/i.test(f.name);
    const fontFiles = files.filter(isFont);
    const imageFiles = files.filter((f) => !isFont(f));

    for (const file of fontFiles) {
      fonts.loadFontData(new Uint8Array(await file.arrayBuffer()));
    }
    if (fontFiles.length) {
      const family = fonts.faces()[0].families[0];
      for (const set of ['setSansSerifFamily', 'setSerifFamily', 'setMonospaceFamily',
                         'setCursiveFamily', 'setFantasyFamily']) fonts[set](family);
    }

    // Targets for a dropped image: an unresolved href, or an image-href variable
    // still waiting for a file.
    let pending = [];
    try { pending = parse().pendingImages(); } catch { /* unparseable, skip */ }
    const varTargets = [...imageHrefVars($('svg').value)].filter((n) => !imageVars.has(n));
    for (const file of imageFiles) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const href = pending.find((h) => h.endsWith(file.name))
        ?? pending.find((h) => !images.has(h));
      if (href) {
        images.set(href, bytes);
        pending = pending.filter((h) => h !== href);
        continue;
      }
      const name = varTargets.shift();
      if (name) {
        imageVars.set(name, { name: file.name, bytes });
        images.set(`var:${name}`, bytes);
        vars.set(name, `var:${name}`);
        varsSignature = null; // force the field to redraw with the file name
      }
    }

    const parts = [];
    if (fontFiles.length) {
      parts.push(`${fontFiles.length} font(s) → ${fonts.faces().map((f) => f.families[0]).join(', ')}`);
    }
    if (imageFiles.length) parts.push(`${images.size} image(s) resolved`);
    log(parts.join('; ') || 'nothing usable in that drop');
    analyse();
    render();
  }

  const drop = $('drop');
  for (const type of ['dragenter', 'dragover']) {
    drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.add('over'); });
  }
  for (const type of ['dragleave', 'drop']) {
    drop.addEventListener(type, () => drop.classList.remove('over'));
  }
  drop.addEventListener('drop', (e) => { e.preventDefault(); accept(e.dataTransfer.files); });
  window.addEventListener('paste', (e) => {
    const files = [...e.clipboardData.files];
    if (files.length) accept(files);
  });

  $('font').addEventListener('change', (ev) => accept(ev.target.files));

  $('svg').addEventListener('input', analyseSoon);

  $('render').addEventListener('click', render);

  function render() {
    const t0 = performance.now();
    try {
      const doc = parse();
      const params = {
        scale: Number($('scale').value) || 1,
        width: $('width').value ? Number($('width').value) : undefined,
        background: $('bg').value || undefined,
        crop: $('crop').checked ? doc.absLayerBoundingBox() : undefined,
      };
      const png = doc.renderPng(params);
      const ms = (performance.now() - t0).toFixed(1);

      // The buffer is a view over the wasm module's shared memory, and Blob
      // refuses shared views -- so copy out first. Same reason applies to
      // fetch bodies, postMessage and canvas data.
      const bytes = new Uint8Array(png);
      $('out').src = URL.createObjectURL(new Blob([bytes], { type: 'image/png' }));
      $('info').textContent = [
        `viewport        ${doc.width} × ${doc.height}`,
        `content bbox    ${fmt(doc.absLayerBoundingBox())}`,
        `geometry bbox   ${fmt(doc.absBoundingBox())}`,
        `png             ${png.length.toLocaleString()} bytes in ${ms} ms`,
        `text nodes      ${doc.hasTextNodes()}   defs: ${doc.hasDefsNodes()}`,
        `pending fonts   ${JSON.stringify(doc.pendingFonts())}`,
        `fonts loaded    ${fonts.faces().map((f) => f.families[0]).join(', ') || 'none'}`,
        `pending images  ${JSON.stringify(doc.pendingImages())}`,
        `gradients       ${doc.linearGradients().map((g) => g.id()).join(', ') || '—'}`,
        `filters         ${doc.filters().map((f) => f.id()).join(', ') || '—'}`,
        `top-level nodes ${doc.children().map((n) => `${n.kind}#${n.id() || '?'}`).join('  ')}`,
      ].join('\n');
      log(`rendered in ${ms} ms`);
    } catch (e) {
      $('info').textContent = '';
      log(`error: ${e.message}`);
    }
  }

  const fmt = (b) => b ? `${b.x} ${b.y} ${b.width} × ${b.height}` : 'none';
</script>
