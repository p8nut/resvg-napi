# Only what nothing else watches. The actions are pinned to major tags and would
# otherwise sit on v7 forever, and the dev dependencies rot quietly. Cargo is
# left out on purpose: .github/workflows/resvg.yml asks upstream every Monday
# whether the resvg version moved, and the `pins` job in CI.yml fails when the
# emnapi and napi-build pins in Cargo.toml stop being necessary. Dependabot has
# no way to know that and would only propose breaking them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: development
      # A runtime dependency, but half of the gate described below.
      - dependency-name: '@napi-rs/wasm-runtime'
    # The emnapi pins cannot move on their own, and that is mechanical rather
    # than a preference: @napi-rs/cli depends on @napi-rs/lzma-wasm32-wasi and
    # @napi-rs/tar-wasm32-wasi, which pin @emnapi/core and @emnapi/runtime
    # EXACTLY -- 1.11.2 with cli 3.8.6. @emnapi/core is transitive, so nothing
    # here can lift it (`npm update @emnapi/core` leaves it where those exact
    # pins hold it), and the builder aborts with `emnapi version mismatch` when
    # the three disagree. Both halves were tried: emnapi alone (#38) and
    # @emnapi/runtime alone (#42) each produced the mismatch, mirrored.
    #
    # The CLI is therefore the gate, and it stays in scope. Its bump pull
    # request is where the two pins move -- the wasm job answers in twenty
    # seconds whether the family lines up, and a mismatch there names the
    # version to write. Weekly, so the question is asked often; no red pull
    # request for a bump that cannot succeed either way.
    ignore:
      - dependency-name: emnapi
      - dependency-name: '@emnapi/runtime'
    groups:
      napi:
        patterns: ['@napi-rs/cli', '@napi-rs/wasm-runtime']
      # Minor and patch only. A major in a group means one breaking bump blocks
      # every safe one in the same pull request -- majors come on their own,
      # where a red build points at the dependency that caused it.
      dev-dependencies:
        patterns: ['*']
        exclude-patterns: ['@napi-rs/cli', '@napi-rs/wasm-runtime']
        update-types: [minor, patch]
