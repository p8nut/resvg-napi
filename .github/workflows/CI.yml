name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    # `labeled` is not a default type, and without it the `full-matrix` label
    # would be an escape hatch that never fires: applying it produces an event
    # this workflow does not listen for, and a re-run replays the old payload
    # with no label on it.
    types: [opened, synchronize, reopened, labeled]
    # Markdown and the licence cannot break a build. This skips the whole
    # workflow rather than gating a job, so there is nothing to pay for -- but
    # it also means no check reports at all, which would deadlock a required
    # check if main is ever protected. The notices are the exception: CI
    # checks them against the crate graph, so a pull request touching only
    # them must run. paths-ignore has no negation, hence the ordered list.
    paths:
      - '**'
      - '!**/*.md'
      - '!LICENSE*'
      - '**/THIRD-PARTY-NOTICES.md'
  schedule:
    # Daily, 07:00 UTC -- asks upstream whether the flate2 hold can go and
    # whether Cargo.lock or the toolchain moved. A red run repeats daily until
    # acted on.
    - cron: '0 7 * * *'
  workflow_dispatch:

# A second push to a branch makes the first run's answer worthless, but it kept
# running to the end all the same -- nine build targets and four test matrices
# of it. Cancel only for pull_request: a superseded main or tag run may already
# be publishing, and killing that mid-way is how you get a half-published
# release.
#
# Pushes are grouped by commit, not branch: a release pushes the same commit
# twice, once as the merge to main and once as the `v*` tag, and both ran the
# full matrix. The tag run cancels the main run on that commit -- it builds
# and tests the same thing and is the one that publishes, so the commit keeps
# a full CI either way. Nothing ever cancels a tag run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}

# Read-only unless a job says otherwise (publish does). Written here rather
# than left to the repository's default token setting, which this file cannot
# see and a settings change could widen.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Which targets this event deserves. Thirteen of them on every push is most of
  # a CPU-hour spent learning that a comment changed, so a pull request builds
  # the two that can tell it something -- the one the tests, the drift checks and
  # the conformance suite run on, and wasm, whose shims and test run are a
  # different code path. The rest waits for the merge, the tag, a manual
  # dispatch, or a `full-matrix` label when the proof is wanted before merging.
  #
  # The targets are package.json's `napi.targets`; the script derives each
  # one's host and cross flag from the triple.
  plan:
    name: plan
    # The daily cron is for `lock` alone. Without this it also
    # rebuilt and retested all thirteen targets on an unchanged main; every job
    # below `needs` plan, so skipping it skips them.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.p.outputs.targets }}
      tests: ${{ steps.p.outputs.tests }}
      full: ${{ steps.p.outputs.full }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci-targets.mjs >> "$GITHUB_OUTPUT"
      # napi-derive's expansion calls napi API without depending on napi, so
      # cargo happily resolves a pair that does not build: derive 3.6.13 calls
      # defer_native_borrow_scope, which napi only has from 3.15.0. Holding the
      # declared minimums to the lockfile keeps them a pair this CI has built;
      # red here means: raise them in the same pull request as the lock.
      - name: napi minimums match Cargo.lock
        run: |
          for spec in napi:Cargo.toml napi-derive:Cargo.toml napi:crates/napi-support/Cargo.toml \
                      napi:crates/toy-napi/Cargo.toml napi-derive:crates/toy-napi/Cargo.toml; do
            c=${spec%%:*}; f=${spec#*:}
            locked=$(awk -v n="$c" '$0 == "name = \"" n "\"" { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
            declared=$(sed -nE "s/^$c = (\{ version = )?\"([^\"]*)\".*/\2/p" "$f")
            echo "$f $c: declares $declared, locked $locked"
            [ "$declared" = "$locked" ] || { echo "::error file=$f::raise $c to $locked"; exit 1; }
          done
      # The scripts' own tests: pure JS on node builtins, no binary and no
      # install, so once here rather than on every test-matrix entry. `.spec`
      # rather than `.test`, which `node --test` would also pick up from
      # `npm test` on every matrix entry.
      - run: node --test "scripts/*.spec.mjs"
      # The generic crates name no wrapped crate, comments included: whole
      # words, case sensitive (ADR 0002, Q35). What is specific to resvg goes
      # through napi_gen::Config, filled by build/config.rs; crates/toy-napi
      # proves the rest builds without it.
      - name: napi-gen and napi-support stay generic
        run: |
          if git grep -nwE 'usvg|resvg|fontdb|tiny_skia|tiny-skia|svgtypes' -- crates/napi-gen crates/napi-support; then
            echo "::error::crates/napi-gen and crates/napi-support must not name a wrapped crate (ADR 0002, Q35): move the spelling into napi_gen::Config (build/config.rs), or reword the comment with the toy crate's names"
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # rustup is on every hosted runner; with no argument it installs the
      # toolchain rust-toolchain.toml pins, and the target is added to that one.
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # A release is a `v*` tag alone: the repository stays at 0.0.0 and the
      # version comes from the tag's name (CONTRIBUTING.md, Releasing). Staged,
      # so the build job's drift check compares against the versioned tree.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}" && git add -A
      # `npm install`, not `npm ci`: the resvg-napi-<platform>
      # optionalDependencies name 0.0.0, or on a tag a version the publish job
      # has not put on the registry yet, so they are never in the lock file.
      # `npm ci` refuses on that mismatch; `npm install` tolerates an
      # unresolvable *optional* dep.
      - run: npm install
      # musl cross-compiles through zig (`-x`). The previous `--use-cross`
      # needed a `cross` binary that no step ever installed, so both musl
      # targets died on `spawn cross ENOENT`; upstream also calls --use-cross
      # legacy and not recommended.
      #
      # Installed by hand rather than through mlugg/setup-zig, which declares
      # `using: node20` on both its latest tag and main and so trips the Node
      # 20 deprecation with no version to move to. A plain `run:` has no Node
      # runtime to deprecate, drops a third-party action from the supply
      # chain, and pins the compiler: that action defaults to `latest`, so the
      # musl link was floating on whatever Zig shipped most recently.
      # Both musl targets cross-compile from an x86_64 host, so one tarball.
      - name: Install zig
        if: contains(matrix.target, 'musl')
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          set -euo pipefail
          dir="zig-x86_64-linux-$ZIG_VERSION"
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/$dir.tar.xz"
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$dir" >> "$GITHUB_PATH"
      # One target only: the toolchain and the cache are already warm here, and
      # nothing in this repo is target-specific enough to lint nine times.
      - name: Lint
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --release --all-targets -- -D warnings

      - name: Build
        run: npx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.build_args }}

      # A glibc binary runs on systems at least as new as the newest symbol
      # version it links. Built on the runner instead of napi-cross, x64 asked
      # for 2.35 and nothing failed: the runner always has it. readelf, not
      # objdump, because it reads the arm binaries from an x64 host.
      - name: glibc floor is 2.17
        if: contains(matrix.target, '-linux-gnu')
        run: |
          need=$(readelf -V resvg-napi.*.node | grep -oE 'GLIBC_[0-9.]+' | sort -V -u | tail -1)
          echo "needs $need"
          if [ "$(printf '%s\n' "$need" GLIBC_2.17 | sort -V | tail -1)" != GLIBC_2.17 ]; then
            echo "::error::${{ matrix.target }} links $need; build it with --use-napi-cross"
            exit 1
          fi

      # The toy crate, bound by the same generator with its own config and
      # template: the proof that napi-gen needs nothing of resvg. Built before
      # the drift check below, which then covers its committed src/lib.rs and
      # index.d.ts too. Debug: nothing ships it, and it builds in seconds.
      - name: Toy binding builds and passes
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          npx napi build --cwd crates/toy-napi --platform --no-js
          node --test crates/toy-napi/toy.spec.mjs

      # The build regenerates committed files: src/lib.rs and index.d.ts from
      # the upstream sources (build.rs), index.js and browser.js, and on wasm the
      # WASI loader shims. The generators are deterministic, so anything the
      # build left changed -- or added -- means the checked-in files no longer
      # match what the pinned versions produce. The whole tree rather than a
      # list of paths, so a newly generated file cannot slip past.
      # package-lock.json is the exception: `npm install` above may rewrite it,
      # as explained there. Compared with the index, not HEAD: on a tag the
      # index holds the versioned tree, which the build must reproduce.
      - name: Generated files are up to date
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'wasm32-wasip1-threads'
        run: |
          changed=$(git diff --name-only -- . ':!package-lock.json'; git ls-files --others --exclude-standard)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- . ':!package-lock.json'
            exit 1
          fi

      # The codegen's report -- what it derived, and what it left alone with the
      # reason -- is documentation now: the README points at it as the answer to
      # "why is this member missing". So it is snapshotted the way the generated
      # output is, and a usvg bump that changes the derived surface shows up as a
      # diff instead of passing unnoticed in a log nobody reads.
      - name: Codegen report is up to date
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          npm run report
          git diff --exit-code -- codegen-report.txt

      # The same treatment for what the binary links: every crate whose licence
      # asks to travel with a binary distribution, read from the crate graph.
      # It sits here rather than in the package job because it reads that graph
      # with `cargo metadata --offline`, and the package job has neither a
      # toolchain nor a warm registry -- it would fail on `log` before reaching
      # a licence. A resvg bump that moves the graph fails on this diff.
      #
      # `--offline` needs every crate in the graph on disk, Windows-only ones
      # included, and a Linux build downloads only what it compiles. A warm
      # cache hid that until rustc 1.99 changed its key: on a cold one the step
      # died on `failed to download windows-link`. `cargo fetch` without
      # `--target` downloads the whole graph.
      #
      # The script rewrites the notice and its copies in every npm/* package,
      # with their files[] entries; status rather than diff, so a copy written
      # where none was committed fails too.
      - name: Third-party notices are up to date
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo fetch --locked
          npm run licenses
          changed=$(git status --porcelain -- THIRD-PARTY-NOTICES.md npm)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- THIRD-PARTY-NOTICES.md npm
            echo "::error::run npm run licenses and commit the result"
            exit 1
          fi

      # esbuild has exactly one consumer -- demo/build.mjs -- and pages.yml runs
      # only on main, so an esbuild bump was provable only after merging, in the
      # deploy. `demo:build` is not used here: it would rebuild the wasm this
      # job already produced, which is the file the script copies.
      - name: The demo still bundles
        if: matrix.target == 'wasm32-wasip1-threads'
        run: node demo/build.mjs

      # The whole suite against the wasm build, not just a smoke test: the
      # binding is the same generated code, but the environment is not -- WASI
      # has no system fonts, and every test had to stop assuming it did.
      - name: Test suite on wasm
        if: matrix.target == 'wasm32-wasip1-threads'
        run: npm run test:wasi

      # Dependabot bumps the CLI or the crate graph without running any of the
      # generators above, so its pull request fails their drift checks every
      # time (#69). The files are already regenerated at this point, so the diff
      # is kept as an artifact rather than rebuilt by hand:
      #   gh run download <run-id> -p 'regen-*' -D regen
      #   for p in regen/*/regen.patch; do git apply "$p"; done
      # Nothing here commits it: this job runs the freshly bumped packages, and
      # its token stays read-only. Same whole-tree rule as the drift check.
      - name: Keep the regenerated files
        if: failure() && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: |
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-gnu ]; then
            npm run report || true
            npm run licenses || true
          fi
          git diff --binary -- . ':!package-lock.json' > regen.patch
      - if: failure() && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: regen-${{ matrix.target }}
          path: regen.patch
          if-no-files-found: ignore

      # upload v7 / download v8 are the matched pair: v8 stopped unzipping
      # blindly and reads Content-Type instead, to support v7's direct uploads.
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ matrix.artifact_path || '*.node' }}
          if-no-files-found: error

  test:
    name: test ${{ matrix.target }} on node ${{ matrix.node }}
    needs: [plan, build]
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      # Only targets this run actually built: a slim run tests linux-gnu alone.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install  # not `npm ci` -- see the build job
      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
      # A missing font on a native runner means the environment broke, not that
      # it is a sandbox -- without this, seven of the fourteen files skip
      # themselves and the runner still reports fourteen passes. The wasm job
      # below deliberately does not set it: WASI has no font directories.
      - run: npm test
        env:
          RESVG_REQUIRE_FONTS: '1'
      # index.d.ts is generated, so a type regression is a build product
      # regression: cheap to catch here. Once: the types are the same on every
      # leg (and TypeScript 7's extensionless bin does not load on 20.3.0).
      - if: matrix.node == 22 && runner.os == 'Linux'
        run: npm run typecheck

  # What `npm publish` would ship, on every PR instead of only on a `v*` tag.
  # npm drops a files[] entry that is not on disk *silently*, so a platform
  # package whose binary never arrived publishes as a README and a manifest,
  # and the first person to notice is whoever installs it.
  package:
    name: package (dry run)
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # A release is a `v*` tag alone: the repository stays at 0.0.0 and the
      # version comes from the tag's name (CONTRIBUTING.md, Releasing). Staged,
      # so the build job's drift check compares against the versioned tree.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}" && git add -A
      - run: npm install  # not `npm ci` -- see the build job
      # The root tarball and every manifest. Needs no artifacts: the root
      # package holds no platform binary.
      - run: npm run check:package
      # The platform packages need their binaries, so only on a full run:
      # `napi artifacts` walks napi.targets and wants all thirteen, and errors
      # outright on a slim run's two.
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.full == 'true'
        with:
          path: artifacts
      # Sorts each *.node into its npm/<platform>/ package, exactly as the
      # publish job does.
      - if: needs.plan.outputs.full == 'true'
        run: npx napi artifacts -d artifacts --npm-dir npm
      # The publish job's pre-publish, validating without writing: every
      # files[] entry of every platform package on disk, and the wasm
      # package's emnapi pins equal to the emnapi the builder used.
      - if: needs.plan.outputs.full == 'true'
        run: npx napi pre-publish -t npm --dry-run --no-gh-release --skip-optional-publish

      # This is a memory-safety guard, not tidiness -- the 0.3.0 release taught
      # us the difference. `napi8` is on (Cargo.toml), so every #[napi] class
      # carries a type tag hashed from `crate@version::module::ClassName`, and
      # napi checks it before casting the pointer back to its Rust type. The
      # version in that hash is CARGO_PKG_VERSION: Cargo.toml's, not
      # package.json's. 0.3.0 shipped with Cargo.toml still at 0.2.0, so both
      # published binaries stamp the *same* tag, and a FontDatabase from one is
      # accepted by the other with no error -- a pointer read at whatever
      # offsets the other build happened to use. Nothing broke only because
      # resvg stayed at 0.48.1 and the layouts matched.
      #
      # Here rather than in check-package.mjs: that script asks what npm would
      # ship, and the crate version is not part of that answer.
      - name: Cargo.toml carries the npm version
        run: |
          node -e "
            const { readFileSync } = require('fs');
            const npm = require('./package.json').version;
            const crate = readFileSync('Cargo.toml', 'utf8').match(/^version = \"(.+)\"/m)[1];
            if (npm !== crate) {
              console.error(\`package.json is \${npm} and Cargo.toml is \${crate}; every release so far moved both\`);
              process.exit(1);
            }
            console.log(\`both at \${npm}\`);
          "

  # resvg's own corpus, rendered through this binding: 1715 SVGs against the
  # reference PNGs upstream asserts on, with the 20 fonts it ships, at the
  # settings its harness uses. Fifteen seconds including the fetch.
  #
  # This is the half a diff cannot show. `src/lib.rs` moving five doc-comment
  # lines on a resvg bump says nothing about whether the pixels changed.
  conformance:
    name: resvg conformance
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install  # not `npm ci` -- see the build job
      - uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
      # Pinned to the tag matching the resvg Cargo.lock builds (`cargo pkgid`):
      # a reference PNG is only a reference for the version that produced it.
      # The runner's stable cargo reads the lockfile as well as the pinned one,
      # without installing a toolchain for one query.
      - run: npm run conformance:fetch
        env:
          RUSTUP_TOOLCHAIN: stable
      - run: npm run conformance

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    # Not `test` alone: a tag could otherwise publish with the conformance suite
    # red, or with a platform package whose binary never arrived.
    needs: [test, package, conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No `cache: npm` here, unlike every other job: this one holds
          # id-token and contents write, so it installs from a clean state.
      # A release is a `v*` tag alone: the repository stays at 0.0.0 and the
      # version comes from the tag's name (CONTRIBUTING.md, Releasing). Staged,
      # so the build job's drift check compares against the versioned tree.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}" && git add -A
      - run: npm install  # not `npm ci` -- see the build job
      # Trusted publishing: npm trades this job's OIDC token (id-token: write
      # above) for a short-lived publish credential, so no long-lived npm
      # token has to be renewed. Needs npm >= 11.5.1; node 22 ships npm 10.
      # Each package must name this repo and CI.yml as its trusted publisher
      # on npmjs.com (all fourteen do; `npm trust list <pkg>` shows it). 0.4.1
      # was the first release published this way.
      - run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # Sorts each *.node into its npm/<platform>/ package, then rewrites the
      # root package.json optionalDependencies to match.
      - run: npx napi artifacts -d artifacts --npm-dir npm
      # Publishes nothing itself: rewrites optionalDependencies and fills npm/*.
      # This is the only place pre-publish runs. It used to run twice: once here
      # with these flags, and again from a `prepublishOnly` hook without them --
      # and without `--skip-optional-publish` it publishes the platform packages
      # itself, which the loop below would then publish a second time. That hook
      # is gone.
      - run: npx napi pre-publish -t npm --no-gh-release --skip-optional-publish
      # Platform packages first, the root last. An npm version is immutable, so
      # the order decides what a half-finished release leaves behind: root-first
      # publishes a package whose optionalDependencies do not exist yet, and
      # 0.1.0 can never be corrected -- only superseded. This way a failure
      # leaves platform packages nothing references, which is invisible to
      # anyone installing, and the root version stays free to publish once the
      # cause is fixed.
      - name: Publish
        run: |
          # Idempotent: a retried tag re-runs this whole loop, and the packages
          # that landed the first time answer EPUBLISHCONFLICT. Aborting there
          # meant a retry could never reach the root -- the one package that
          # must go last -- so an already-published version is skipped and
          # anything else still fails the job.
          publish_one() {
            local out
            if out=$(npm publish "$1" --access public --provenance 2>&1); then
              printf '%s\n' "$out" | grep '^+ ' || true
              return 0
            fi
            if printf '%s' "$out" | grep -qE 'EPUBLISHCONFLICT|cannot publish over'; then
              printf 'already published: %s\n' "$1"
              return 0
            fi
            printf '%s\n' "$out" >&2
            return 1
          }
          for dir in npm/*/; do publish_one "$dir"; done
          publish_one .

      # A tag is invisible on the repo page -- Releases lists releases, not tags
      # -- and `--generate-notes` fills the body with the pull requests merged
      # since the previous one, which is the changelog nobody has to remember to
      # write. Last in the job on purpose: a release announcing a version the
      # loop above failed to publish points at nothing installable.
      - name: GitHub release
        run: gh release create "$TAG" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, not interpolated into the script: a ref
          # name reaches the shell verbatim otherwise.
          TAG: ${{ github.ref_name }}

  # Dependabot leaves Cargo alone (see .github/dependabot.yml) and resvg.yml
  # only watches resvg, so a semver-compatible transitive fix could sit unused
  # forever. Red means: run `cargo update`, regenerate the notices,
  # open a pull request.
  lock:
    name: Cargo.lock and toolchain up to date
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The steps grep cargo's output: with the workflow's `always`, "Updating"
    # arrives wrapped in colour codes and no pattern ever matched, so the lock
    # check stayed green and the flate2 check said the hold was gone.
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      # Everything but flate2, which the next step holds.
      - name: Cargo.lock is up to date
        run: |
          stale=$(cargo update --dry-run 2>&1 | grep -E 'Updating [^ ]+ v' | grep -v 'Updating flate2 ' || true)
          if [ -n "$stale" ]; then echo "$stale"; exit 1; fi
      # flate2 is held at 1.1.9 in Cargo.lock: 1.1.10 requires miniz_oxide ^0.9
      # while png still requires ^0.8, so taking it compiles two DEFLATE
      # implementations into every artifact. Red here means the hold is no
      # longer needed: `cargo update -p flate2`, and delete this step.
      # Independent of the step above, so a stale lock does not hide it.
      - name: flate2 hold still needed
        if: ${{ !cancelled() }}
        run: |
          # Kept whole, so a red run shows what cargo answered.
          out=$(cargo update -p flate2 --dry-run 2>&1)
          echo "$out"
          if ! printf '%s\n' "$out" | grep -q 'Updating flate2 '; then
            echo "::error::flate2 is already at its newest: the hold is gone, delete this step"; exit 1
          fi
          cargo update -p flate2 --quiet
          dup=$(cargo tree -d -e normal --target all | grep miniz_oxide || true)
          git restore Cargo.lock
          if [ -z "$dup" ]; then
            echo "::error::taking flate2's update no longer duplicates miniz_oxide: lift the hold"; exit 1
          fi
          echo "still held: the update would link $(echo $dup)"
      # rust-toolchain.toml pins the compiler, so nothing else notices a new
      # stable. Red here means: bump the channel there, fix whatever clippy now
      # says, in one pull request.
      - name: rust-toolchain.toml is the latest stable
        if: ${{ !cancelled() }}
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          latest=$(curl -fsSL https://static.rust-lang.org/dist/channel-rust-stable.toml \
            | sed -n '/^\[pkg\.rustc\]/,/^version/s/^version = "\([0-9.]*\).*/\1/p')
          echo "pinned $pinned, latest stable $latest"
          [ -n "$latest" ] && [ "$pinned" = "$latest" ]
      # The minimums in both Cargo.toml files, not just the lockfile, must
      # build: each direct dependency at its declared floor, the rest at their
      # newest. Floors left at "1.0" went unnoticed until one sat below what
      # syn 3 requires. Nightly only resolves; the pinned toolchain builds.
      - name: Declared minimum versions build
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly update -Z direct-minimal-versions
          cargo check --workspace
