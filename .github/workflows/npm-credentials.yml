# Does NPM_TOKEN work? Run this before tagging a release.
#
# What it proves: the secret exists, is a valid npm token, has not expired, and
# belongs to the account that owns the @p8nut scope. Those are the failure modes
# that would otherwise surface halfway through a real publish.
#
# What it does NOT prove: that the token may *write* to the scope. npm has no
# authorization probe short of publishing, so read access and identity are the
# most that can be checked without creating a package. The publish order in
# CI.yml is what limits the damage if that permission turns out to be missing.
#
# Its own workflow so that checking a credential does not start a 20-job matrix.
name: npm credentials

on:
  workflow_dispatch:

jobs:
  check:
    name: can NPM_TOKEN publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Who the token says we are
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if ! who=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN did not authenticate: $who"
            exit 1
          fi
          echo "authenticated as $who"
          if [ "$who" != "p8nut" ]; then
            echo "::error::token authenticates as '$who', but the @p8nut scope is owned by 'p8nut'"
            exit 1
          fi
          echo "- token authenticates as \`$who\`" >> "$GITHUB_STEP_SUMMARY"
      - name: What it can already see in the scope
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # An empty scope is the expected answer before the first release, and
          # npm treats it as an error, so this reports rather than fails.
          if out=$(npm access list packages @p8nut 2>&1); then
            echo "$out"
            echo '- packages already in the scope:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$out" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no packages in @p8nut yet -- expected before the first release"
            echo '- scope is empty, as expected before the first release' >> "$GITHUB_STEP_SUMMARY"
          fi
