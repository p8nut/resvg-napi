[package]
name = "resvg-napi"
version = "0.7.0"
edition = "2024"
authors = ["p8nut <38731495+p8nut@users.noreply.github.com>"]
description = "Node bindings for resvg, generated from the upstream Rust sources."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/p8nut/resvg-napi"
homepage = "https://github.com/p8nut/resvg-napi"
rust-version = "1.88"
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi v3: the runtime crate and the derive crate are versioned SEPARATELY.
# Current napi links the wasm target against the emnapi 2 ABI (napi-build
# hard-exports `emnapi_create_env`), so package.json pins emnapi, @emnapi/core
# and @emnapi/runtime to 2.0.0-beta.2. scripts/wasi-plugins.mjs covers the
# beta's renamed plugin API, which @napi-rs/wasm-runtime has not caught up
# with; scripts/check-pins.mjs says when either can go.
napi = { version = "3.14.2", default-features = false, features = ["napi8"] }  # napi8: active la validation de type-tag des classes
napi-derive = "3.6.12"
# resvg re-exports `usvg`, `usvg::fontdb` and `tiny_skia`, so one dep is enough.
# Its defaults minus `memmap-fonts`, added back below for every target that has
# mmap: WASI does not, and with it fontdb's load_font_file answered
# "unsupported" while load_fonts_dir loaded nothing and said nothing. The
# generator knows (build/config.rs FEATURES) and gates what depends on it.
resvg = { version = "0.48.1", default-features = false, features = ["svgz", "text", "system-fonts", "raster-images"] }
# resvg's own CSS colour parser, same version it uses internally.
svgtypes = "0.16.1"
# usvg/resvg report recoverable problems through `log`; nothing consumes it by
# default, so the messages are lost. We install a collector.
log = "0.4"
# Image headers are sized before resvg allocates their pixels; already in the
# graph through usvg.
imagesize = "0.15"
# The parts of the runtime no resvg-specific code lives in: contained panics,
# bounded logs, capped reads, the checked AbortSignal.
napi-support = { path = "crates/napi-support" }


# Resolver 2 keeps a target table's features to that target.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
resvg = { version = "0.48.1", features = ["memmap-fonts"] }

[build-dependencies]
napi-build = "2.6.0"
syn = { version = "3.0", features = ["full", "extra-traits", "parsing", "printing"] }
quote = "1.0"
proc-macro2 = "1.0"

[profile.release]
lto = true
strip = "symbols"

[workspace]
members = ["crates/napi-support"]
