<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <!--
    Everything a card does with images and glyphs, and nothing it does with
    data: the companion sheet covers loops. Headless:

      node demo/render.mjs examples/photo-card.svg

    On the page, drop a photo on the `photo` field; emoji need an emoji font
    (WASI has no system fonts, so nothing is there until you drop one).
  -->
  <defs>
    <!-- CSS classes: one place to change the theme, values from variables -->
    <style>
      .plate { fill: {{ ink | default: "#101c24" }} }
      .label { fill: {{ dim | default: "#6d8797" }}; font-size: 8px; letter-spacing: .12em }
      .value { fill: {{ paper | default: "#eef4f7" }} }
      .accent { fill: {{ accent | default: "#f2b202" }} }
    </style>

    <!-- A tile, not a repeated element: usvg resolves the pattern once -->
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0 H0 V12" fill="none" stroke="{{ accent | default: '#f2b202' }}" stroke-opacity=".14"/>
    </pattern>

    <!-- The frame the photo is poured into, and a fade at its foot -->
    <clipPath id="frame"><rect x="24" y="60" width="150" height="200" rx="10"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".6" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="foot"><rect x="24" y="60" width="150" height="200" fill="url(#fade)"/></mask>

    <!-- Drawn once, used at two sizes -->
    <symbol id="mark" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11" fill="none" stroke="{{ accent | default: '#f2b202' }}" stroke-width="2"/>
      <path d="M7 13 l4 4 l6 -9" fill="none" stroke="{{ accent | default: '#f2b202' }}" stroke-width="2.5"/>
    </symbol>

    <!-- The baseline for the caption; never painted itself -->
    <path id="arc" d="M210 214 Q310 246 442 206"/>
  </defs>

  <rect width="520" height="300" class="plate"/>
  <rect width="520" height="300" fill="url(#grid)"/>

  <!-- 1. the photo: portrait source, landscape hole, so `slice` has to crop -->
  <image href="{{ photo }}" x="24" y="60" width="150" height="200"
         preserveAspectRatio="xMidYMid slice"
         clip-path="url(#frame)" mask="url(#foot)"/>
  <rect x="24" y="60" width="150" height="200" rx="10" fill="none"
        stroke="{{ accent | default: '#f2b202' }}" stroke-opacity=".5"
        stroke-dasharray="8 5"/>
  <text x="24" y="52" class="label">PHOTO · slice, clipped, masked</text>

  <!-- 2. a 4x4 image blown up both ways: `optimizeSpeed` keeps the pixels,
          the default smooths them. The CSS keyword `pixelated` does nothing. -->
  <image href="{{ tile }}" x="404" y="236" width="44" height="44" image-rendering="optimizeSpeed"/>
  <image href="{{ tile }}" x="452" y="236" width="44" height="44"/>
  <text x="404" y="230" class="label">SPEED · QUALITY</text>

  <!-- 3. title: stroke behind the fill, so the outline never eats the letters -->
  <text x="210" y="96" font-size="34" font-weight="700" class="value"
        stroke="{{ accent | default: '#f2b202' }}" stroke-width="5" paint-order="stroke"
        >{{ name | default: "Ada Lovelace" | fit: 250, 34 | escape }}</text>
  <text x="210" y="52" class="label">PAINT-ORDER · stroke first</text>

  <!-- 4. one symbol, two sizes -->
  <use href="#mark" x="210" y="110" width="18" height="18"/>
  <use href="#mark" x="470" y="20" width="30" height="30"/>
  <text x="234" y="124" class="value" font-size="12"
        >{{ role | default: "Analytical engine" | escape }}</text>

  <!-- 5. glyph coverage: an emoji is a glyph like any other. Which font serves
          it is the database's decision, so the family is a variable: a
          monochrome fallback (Symbola, DejaVu) wins otherwise. -->
  <text x="210" y="156" font-size="20"
        font-family="{{ emojiFamily | default: 'sans-serif' }}">{{ mood | default: "🚀" }}</text>
  <text x="244" y="156" class="value" font-size="12"
        >{{ tagline | default: "a colour glyph is the font's job" | fit: 250, 12 | escape }}</text>

  <!-- 6. vertical text, for a spine or a margin note -->
  <text x="502" y="150" writing-mode="tb" class="label">{{ edition | default: "FIRST EDITION" }}</text>

  <!-- 7. letter-spacing and a measured rule under it -->
  <text x="210" y="266" class="accent" font-size="13" letter-spacing="6"
        >{{ code | default: "AL-1843" }}</text>
  <rect x="210" y="274" width="{{ code | default: 'AL-1843' | measure: 13 | plus: 42 }}" height="1"
        class="accent"/>
  <text x="210" y="288" class="label">LETTER-SPACING · rule measured, plus the tracking</text>

  <text x="210" y="196" class="label">TEXTPATH · curve in defs, text fitted to its length</text>

  <!-- 8. the caption follows a path, which is only ever a reference -->
  <text font-size="12" class="value" opacity=".85">
    <textPath href="#arc">{{ caption | default: "on a path, and only on the path" | fit: 236, 12 | escape }}</textPath>
  </text>
</svg>
