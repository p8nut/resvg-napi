# Watches resvg for a release and opens the bump as a PR, with the pixel
# difference measured rather than assumed.
#
# Separate from CI.yml for the permissions: this one writes a branch and opens a
# pull request, and CI has no business being able to.
#
# It deliberately does not run the test matrix -- opening the PR triggers CI,
# which runs it better. What this job does that CI cannot is compare the new
# corpus against the *old* baseline, so the PR body says which renders changed.
# After that comparison the baseline is regenerated, because from the PR's point
# of view the new reference PNGs are the truth.
name: resvg

on:
  schedule:
    # Mondays, 07:15 UTC -- a quarter hour after the pins check, so a red run
    # from either is unambiguous.
    - cron: '15 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: resvg-bump
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  bump:
    name: bump resvg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install  # not `npm ci` -- see CI.yml

      - name: Ask crates.io
        id: probe
        run: node scripts/check-resvg.mjs >> "$GITHUB_OUTPUT"

      # An open PR from a previous week is not a reason to open it again.
      - name: Already proposed?
        id: seen
        if: steps.probe.outputs.bump == 'true'
        run: |
          git ls-remote --exit-code --heads origin "${{ steps.probe.outputs.branch }}" >/dev/null \
            && echo "open=true" >> "$GITHUB_OUTPUT" \
            || echo "open=false" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.seen.outputs.open == 'false'
      - uses: Swatinem/rust-cache@v2
        if: steps.seen.outputs.open == 'false'

      # The bindings are generated from the upstream sources, so a resvg bump
      # rewrites src/lib.rs and index.d.ts. That regeneration is the commit.
      - name: Bump and regenerate
        if: steps.seen.outputs.open == 'false'
        run: |
          set -euo pipefail
          sed -i 's/^resvg = "[^"]*"/resvg = "${{ steps.probe.outputs.latest }}"/' Cargo.toml
          npx napi build --platform --release
          # The report diff is what tells a reviewer whether a red PR means the
          # surface moved benignly or something broke. Captured before the
          # snapshot is rewritten, because afterwards there is nothing to diff.
          npm run report -- -w >/dev/null
          {
            echo '```diff'
            git diff --no-color -- codegen-report.txt | tail -60
            echo '```'
          } > /tmp/report.md
          git diff --quiet -- codegen-report.txt && echo '_The derived surface is unchanged._' > /tmp/report.md

      # The old baseline against the new corpus: this is the measurement, and it
      # is the only thing here that says whether the rendering changed.
      - name: Measure the pixel difference
        if: steps.seen.outputs.open == 'false'
        run: |
          npm run conformance:fetch
          echo '```' > /tmp/diff.md
          npm run --silent conformance 2>&1 | tail -40 >> /tmp/diff.md || true
          echo '```' >> /tmp/diff.md
          npm run conformance -- -w

      - name: Open the PR
        if: steps.seen.outputs.open == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ steps.probe.outputs.current }}
          TO: ${{ steps.probe.outputs.latest }}
          BRANCH: ${{ steps.probe.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add Cargo.toml Cargo.lock src/lib.rs index.d.ts index.js \
                  codegen-report.txt conformance/baseline.txt
          git commit -m "chore(deps): resvg $FROM -> $TO"
          git push -u origin "$BRANCH"
          {
            echo "Generated by the weekly \`resvg\` workflow."
            echo
            echo "## What the generator derives, before and after"
            echo
            cat /tmp/report.md
            echo
            echo "## Conformance, new corpus against the old baseline"
            echo
            cat /tmp/diff.md
            echo
            echo "The baseline is regenerated in this commit: from here on the"
            echo "$TO reference PNGs are the truth. The block above is the only"
            echo "record of what moved, so read it before merging."
            echo
            echo "\`src/lib.rs\` and \`index.d.ts\` are regenerated too. CI on this"
            echo "PR goes red whenever the surface moves -- a test pins the exact"
            echo "member set of \`FontFace\` on purpose -- so read the report diff"
            echo "above before assuming something broke."
          } > /tmp/body.md
          gh pr create --base main --head "$BRANCH" \
            --title "chore(deps): resvg $FROM -> $TO" --body-file /tmp/body.md
