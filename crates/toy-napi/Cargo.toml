[package]
name = "toy-napi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
description = "The toy crate's napi binding, generated by napi-gen: CI's proof the generator is generic"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16.1", default-features = false, features = ["napi8", "napi9"] }
napi-derive = "3.7.0"
napi-support = { path = "../napi-support" }
toy = { path = "../toy" }

[build-dependencies]
napi-build = "2.6.0"
napi-gen = { path = "../napi-gen" }
syn = { version = "3.0", features = ["full", "extra-traits", "parsing", "printing"] }
quote = "1.0.35"
