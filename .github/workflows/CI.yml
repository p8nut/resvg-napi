name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    # `labeled` is not a default type, and without it the `full-matrix` label
    # would be an escape hatch that never fires: applying it produces an event
    # this workflow does not listen for, and a re-run replays the old payload
    # with no label on it.
    types: [opened, synchronize, reopened, labeled]
    # Markdown and the licence cannot break a build. This skips the whole
    # workflow rather than gating a job, so there is nothing to pay for -- but
    # it also means no check reports at all, which would deadlock a required
    # check if main is ever protected.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
  schedule:
    # Mondays, 07:00 UTC -- asks upstream whether the Cargo.toml pins can go.
    - cron: '0 7 * * 1'
  workflow_dispatch:

# A second push to a branch makes the first run's answer worthless, but it kept
# running to the end all the same -- nine build targets and four test matrices
# of it. Cancel only for pull_request: a superseded main or tag run may already
# be publishing, and killing that mid-way is how you get a half-published
# release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Which targets this event deserves. Thirteen of them on every push is most of
  # a CPU-hour spent learning that a comment changed, so a pull request builds
  # the two that can tell it something -- the one the tests, the drift checks and
  # the conformance suite run on, and wasm, whose shims and test run are a
  # different code path. The rest waits for the merge, the tag, a manual
  # dispatch, or a `full-matrix` label when the proof is wanted before merging.
  #
  # The script is also where the target list lives: it asserts against
  # package.json's `napi.targets` rather than being a second copy of it.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.p.outputs.targets }}
      tests: ${{ steps.p.outputs.tests }}
      full: ${{ steps.p.outputs.full }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci-targets.mjs >> "$GITHUB_OUTPUT"
      # Two targets where thirteen are expected reads as a broken matrix unless
      # the run says why it chose that.
      - name: Say what was chosen
        run: |
          {
            if [ "${{ steps.p.outputs.full }}" = "true" ]; then
              echo "Full matrix: every target in \`napi.targets\`."
            else
              echo "Slim matrix: \`x86_64-unknown-linux-gnu\` and \`wasm32-wasip1-threads\`."
              echo ""
              echo "The other eleven build on merge, on a \`v*\` tag, on a manual dispatch,"
              echo "or on this pull request with the \`full-matrix\` label."
            fi
            echo ""
            echo '```json'
            echo '${{ steps.p.outputs.targets }}' | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(t=>t.target).join("\n")))'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # `npm install`, not `npm ci`: package.json declares the nine
      # resvg-napi-<platform> optionalDependencies, and nothing is published
      # yet, so they cannot be in the lock file. `npm ci` refuses on that
      # mismatch; `npm install` tolerates an unresolvable *optional* dep.
      # Switch back once 0.1.0 is on the registry.
      - run: npm install
      # musl cross-compiles through zig (`-x`). The previous `--use-cross`
      # needed a `cross` binary that no step ever installed, so both musl
      # targets died on `spawn cross ENOENT`; upstream also calls --use-cross
      # legacy and not recommended.
      #
      # Installed by hand rather than through mlugg/setup-zig, which declares
      # `using: node20` on both its latest tag and main and so trips the Node
      # 20 deprecation with no version to move to. A plain `run:` has no Node
      # runtime to deprecate, drops a third-party action from the supply
      # chain, and pins the compiler: that action defaults to `latest`, so the
      # musl link was floating on whatever Zig shipped most recently.
      # Both musl targets cross-compile from an x86_64 host, so one tarball.
      - name: Install zig
        if: contains(matrix.target, 'musl')
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          set -euo pipefail
          dir="zig-x86_64-linux-$ZIG_VERSION"
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/$dir.tar.xz"
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$dir" >> "$GITHUB_PATH"
      # One target only: the toolchain and the cache are already warm here, and
      # nothing in this repo is target-specific enough to lint nine times.
      - name: Lint
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings

      # napi-derive-backend is transitive, so Cargo.toml cannot name it and only
      # Cargo.lock holds it. 6.1.1 began emitting NativeBorrowScope, which needs
      # napi 3.12, and the wasm target then stops linking. A comment above `napi`
      # says so; this makes `cargo update` fail here rather than in a build.
      - name: Cargo.lock still holds the transitive pin
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          grep -A1 '^name = "napi-derive-backend"' Cargo.lock \
            | grep -q 'version = "6.0.0"' \
            || { echo "::error::napi-derive-backend moved off 6.0.0 -- see the comment above napi in Cargo.toml"; exit 1; }

      - name: Build
        run: npx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.build_args }}

      # build.rs regenerates src/lib.rs from the upstream sources. It is
      # committed, and the generator is deterministic, so any diff here means the
      # checked-in bindings no longer match what the pinned usvg/resvg produce.
      - name: Generated bindings are up to date
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: git diff --exit-code -- src/lib.rs index.d.ts index.js browser.js

      # The codegen's report -- what it derived, and what it left alone with the
      # reason -- is documentation now: the README points at it as the answer to
      # "why is this member missing". So it is snapshotted the way the generated
      # output is, and a usvg bump that changes the derived surface shows up as a
      # diff instead of passing unnoticed in a log nobody reads.
      - name: Codegen report is up to date
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: npm run report

      # The WASI loader shims are generated and committed too, but only the
      # wasm build emits them (they are this job's upload-artifact payload
      # below), so the linux-gnu job above cannot see them drift.
      - name: Generated WASI shims are up to date
        if: matrix.target == 'wasm32-wasip1-threads'
        run: git diff --exit-code -- resvg-napi.wasi.cjs resvg-napi.wasi.d.cts resvg-napi.wasi-browser.js wasi-worker.mjs wasi-worker-browser.mjs

      - name: WASI smoke test
        if: matrix.target == 'wasm32-wasip1-threads'
        run: |
          node -e "
            const m = require('./resvg-napi.wasi.cjs');
            const svg = '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"8\" height=\"8\"><rect width=\"8\" height=\"8\" fill=\"teal\"/></svg>';
            const png = new m.Resvg(svg).renderPng();
            if (png.subarray(0, 4).toString('hex') !== '89504e47') throw new Error('not a PNG');
            console.log('wasm renders:', png.length, 'bytes');
          "

      # The whole suite against the wasm build, not just a smoke test: the
      # binding is the same generated code, but the environment is not -- WASI
      # has no system fonts, and every test had to stop assuming it did.
      - name: Test suite on wasm
        if: matrix.target == 'wasm32-wasip1-threads'
        run: npm run test:wasi

      # upload v7 / download v8 are the matched pair: v8 stopped unzipping
      # blindly and reads Content-Type instead, to support v7's direct uploads.
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ matrix.artifact_path || '*.node' }}
          if-no-files-found: error

  test:
    name: test ${{ matrix.target }} on node ${{ matrix.node }}
    needs: [plan, build]
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      # Only targets this run actually built: a slim run tests linux-gnu alone.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install  # not `npm ci` -- see the build job
      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
      # A missing font on a native runner means the environment broke, not that
      # it is a sandbox -- without this, seven of the fourteen files skip
      # themselves and the runner still reports fourteen passes. The wasm job
      # below deliberately does not set it: WASI has no font directories.
      - run: npm test
        env:
          RESVG_REQUIRE_FONTS: '1'
      # index.d.ts is generated, so a type regression is a build product
      # regression: cheap to catch here.
      - run: npm run typecheck
      # Offline: covers the decision in scripts/check-pins.mjs, including the
      # path where it reports the pins as obsolete. The networked half runs on
      # a schedule in the `pins` job.
      - run: npm run check:pins:selftest
      - run: npm run check:package:selftest
      - run: npm run report:selftest
      - run: npm run conformance:selftest
      - run: npm run check:resvg:selftest
      - run: npm run ci:targets:selftest

  # What `npm publish` would ship, on every PR instead of only on a `v*` tag.
  # npm drops a files[] entry that is not on disk *silently*, so a platform
  # package whose binary never arrived publishes as a README and a manifest,
  # and the first person to notice is whoever installs it.
  #
  # `napi pre-publish` is deliberately not run here: it rewrites the manifest
  # and its behaviour without a registry token is unknown, so it stays the one
  # step of the publish path that the first real tag will exercise for us.
  package:
    name: package (dry run)
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install  # not `npm ci` -- see the build job
      # `napi artifacts` walks package.json's napi.targets and wants a binary for
      # every one of the thirteen, so it errors outright on a slim run's two --
      # this is not a check being lenient, it is a step that cannot run at all.
      # `--root-only` needs no artifacts: the root tarball holds no platform
      # binary, and the files[] entries npm drops in silence are what it checks.
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.full == 'true'
        with:
          path: artifacts
      # Sorts each *.node into its npm/<platform>/ package, exactly as the
      # publish job does.
      - if: needs.plan.outputs.full == 'true'
        run: npx napi artifacts -d artifacts --npm-dir npm
      - run: npm run check:package -- ${{ needs.plan.outputs.full == 'true' && '--all' || '--root-only' }}

  # resvg's own corpus, rendered through this binding: 1715 SVGs against the
  # reference PNGs upstream asserts on, with the 20 fonts it ships, at the
  # settings its harness uses. Fifteen seconds including the fetch.
  #
  # This is the half a diff cannot show. `src/lib.rs` moving five doc-comment
  # lines on a resvg bump says nothing about whether the pixels changed.
  conformance:
    name: resvg conformance
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install  # not `npm ci` -- see the build job
      - uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
      # Pinned to the tag matching Cargo.toml's resvg: a reference PNG is only a
      # reference for the version that produced it.
      - run: npm run conformance:fetch
      - run: npm run conformance

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    # Not `test` alone: a tag could otherwise publish with the conformance suite
    # red, or with a platform package whose binary never arrived.
    needs: [test, package, conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install  # not `npm ci` -- see the build job
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # Sorts each *.node into its npm/<platform>/ package, then rewrites the
      # root package.json optionalDependencies to match.
      - run: npx napi artifacts -d artifacts --npm-dir npm
      # Publishes nothing itself: rewrites optionalDependencies and fills npm/*.
      # This is the only place pre-publish runs. It used to run twice: once here
      # with these flags, and again from a `prepublishOnly` hook without them --
      # and without `--skip-optional-publish` it publishes the platform packages
      # itself, which the loop below would then publish a second time. That hook
      # is gone.
      - run: npx napi pre-publish -t npm --no-gh-release --skip-optional-publish
      # Platform packages first, the root last. An npm version is immutable, so
      # the order decides what a half-finished release leaves behind: root-first
      # publishes a package whose optionalDependencies do not exist yet, and
      # 0.1.0 can never be corrected -- only superseded. This way a failure
      # leaves platform packages nothing references, which is invisible to
      # anyone installing, and the root version stays free to publish once the
      # cause is fixed.
      - name: Publish
        run: |
          for dir in npm/*/; do npm publish "$dir" --access public --provenance; done
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Fails when the Rust pins in Cargo.toml are no longer needed: either emnapi
  # shipped a stable 2.x, or napi-build stopped hard-exporting the emnapi 2
  # symbols. A red scheduled run is the signal to upgrade -- nothing else
  # watches for it.
  pins:
    name: pins still needed
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check:pins
